[project]
name = "webex-obs-companion"
version = "0.2.0"
description = "Automated Webex meeting recorder, local MLX Whisper transcriber, neural speaker diarizer, dynamic OBS window binder, and permanent Webex Bot delivery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "obs-websocket-py>=1.0.0",
    "mlx-whisper>=0.4.1",
    "psutil>=6.0.0",
    "pynput>=1.7.7",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyobjc-framework-Quartz>=9.0",
    "certifi>=2024.0.0",
    "truststore>=0.9.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
neural-diarization = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pyannote.audio>=3.1.1",
]

[project.scripts]
webex-obs = "webex_obs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webex_obs"]
